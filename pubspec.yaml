publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.0


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0



# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  assets:
    - assets/golf_bg.jpg
    - assets/logo.png
    - assets/golf-ball-grass-field 3.png
    - assets/profile.jpeg
